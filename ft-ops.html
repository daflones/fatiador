<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:#e8e8ee;--txt:#17171c;--muted:#71717e;--red:#e11d48;--grad:linear-gradient(135deg,#e11d48,#f97316);--green:#16a34a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
h1 img{width:30px;height:30px;border-radius:8px}
h2{font-size:14px;font-weight:800;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi .v{font-size:24px;font-weight:800}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi.hl{border-color:#fecdd3;background:#fff5f4}
.kpi.hl .v{color:var(--red)}
.kpi.ok{border-color:#bbf7d0;background:#f0fdf4}
.kpi.ok .v{color:var(--green)}
input,select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:var(--red)}
button{border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-p{background:var(--grad);color:#fff;width:100%}
.btn-s{background:var(--bg);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border:0}
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.st.paid{background:#dcfce7;color:#15803d}
.st.pending{background:#fef9c3;color:#a16207}
.st.other{background:var(--bg);color:var(--muted)}
.funnel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.funnel .step{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.funnel .step b{display:block;font-size:15px}
.funnel .arr{color:var(--muted)}
.pct{font-size:10.5px;color:var(--muted)}
.addr{font-size:11.5px;color:var(--muted)}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef2ff;color:#635bff}
.tag.pix{background:#ccfbf1;color:#0f766e}
.hidden{display:none!important}
.logout{float:right;font-size:12px;color:var(--muted);background:none;text-decoration:underline;padding:4px}
.scroll{overflow-x:auto}
.msg{font-size:13px;margin-top:8px}
.msg.e{color:#b91c1c}.msg.o{color:var(--green)}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="card" style="max-width:380px;margin:12vh auto 0">
    <h1 style="justify-content:center;margin-bottom:18px"><img src="img/logo.png" alt="">Acesso restrito</h1>
    <input id="l-email" type="email" placeholder="E-mail" style="margin-bottom:10px">
    <input id="l-pass" type="password" placeholder="Senha" style="margin-bottom:14px">
    <button class="btn-p" id="l-btn">ENTRAR</button>
    <p class="msg e" id="l-err"></p>
  </div>

  <!-- PAINEL -->
  <div id="panel" class="hidden">
    <button class="logout" id="btn-out">sair</button>
    <h1><img src="img/logo.png" alt="">Painel — Fatiador 14 em 1</h1>
    <p style="font-size:12px;color:var(--muted)">Atualizado em <span id="ts">–</span> · <a href="#" id="btn-reload" style="color:var(--red)">atualizar</a></p>

    <h2>Funil (todos os tempos)</h2>
    <div class="card funnel" id="funnel"></div>

    <h2>Métricas</h2>
    <div class="grid" id="kpis"></div>

    <h2>Preço do produto</h2>
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div><label style="font-size:11px;color:var(--muted)">Preço (R$)</label><input id="p-price" type="number" step="0.01" min="0"></div>
        <div><label style="font-size:11px;color:var(--muted)">De (R$)</label><input id="p-compare" type="number" step="0.01" min="0"></div>
        <div><label style="font-size:11px;color:var(--muted)">Estoque</label><input id="p-stock" type="number" min="0"></div>
      </div>
      <button class="btn-p" id="p-save" style="margin-top:12px">SALVAR PREÇO</button>
      <p class="msg" id="p-msg"></p>
    </div>

    <h2>Pedidos</h2>
    <div class="card scroll"><table id="orders"><thead><tr><th>#</th><th>Cliente</th><th>Entrega</th><th>Pagto</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table></div>

    <h2>Últimos eventos</h2>
    <div class="card scroll"><table id="events"><thead><tr><th>Hora</th><th>Evento</th><th>Detalhe</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
const SUPA_URL='https://qiavgoutaxfaldsgggly.supabase.co';
const SUPA_KEY='sb_publishable_29pfzSVIG1Iv8KUDwWGm4g_vTs8VV9v';
const PID='2e67801b-93d6-4754-bfa4-44e4f134ac3a';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
const brl=c=>'R$ '+(c/100).toFixed(2).replace('.',',');
const hr=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

/* ---------- auth ---------- */
sb.auth.getSession().then(({data:{session}})=>{if(session)boot(session);});
$('l-btn').onclick=async()=>{
  $('l-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});
  if(error){$('l-err').textContent='Credenciais inválidas.';return;}
  const {data:{session}}=await sb.auth.getSession();
  boot(session);
};
$('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('l-btn').click();});
$('btn-out').onclick=async()=>{await sb.auth.signOut();location.reload();};

async function boot(session){
  if(!session)return;
  // verifica papel admin (policy "read own role")
  const {data:roles}=await sb.from('user_roles').select('role').eq('user_id',session.user.id);
  if(!roles?.some(r=>r.role==='admin')){$('l-err').textContent='Acesso restrito a administradores.';return;}
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
  loadAll();
}
$('btn-reload').onclick=e=>{e.preventDefault();loadAll();};

/* ---------- dados ---------- */
async function loadAll(){
  $('ts').textContent=new Date().toLocaleTimeString('pt-BR');
  const {data:ev}=await sb.from('page_events').select('event,meta,session_id,created_at').eq('page','fatiador').order('created_at',{ascending:false}).limit(2000);
  const counts={};const sessions=new Set();
  (ev||[]).forEach(e=>{counts[e.event]=(counts[e.event]||0)+1;sessions.add(e.session_id);});

  const {data:orders}=await sb.from('orders').select('id,number,status,payment_method,total_cents,currency,customer_name,email,phone,shipping_address,created_at,order_items!inner(product_id)').eq('order_items.product_id',PID).order('created_at',{ascending:false}).limit(100);
  const PAID=['paid','processing','shipped','delivered'];
  const paid=(orders||[]).filter(o=>PAID.includes(o.status)).length;

  /* funil */
  const steps=[['Visita','pageview'],['Swipe galeria','gal_swipe'],['Clique CTA','cta_click'],['Checkout','checkout_start'],['PIX gerado','pix_generated'],['Pago','paid']];
  $('funnel').innerHTML=steps.map(([l,k],i)=>{
    const n=k==='paid'?paid:(counts[k]||0);
    const prev=i?steps[i-1][1]:null;
    const pn=prev==='paid'?paid:(prev?(counts[prev]||0):0);
    const pct=i&&pn?` <span class="pct">${Math.round(n/pn*100)}%</span>`:'';
    return (i?'<span class="arr">→</span>':'')+`<span class="step"><b>${n}</b>${l}${pct}</span>`;
  }).join('')+`<span class="arr">→</span><span class="step"><b>${(orders||[]).length}</b>Pedidos</span>`;

  /* kpis */
  const kpis=[
    ['Sessões únicas',sessions.size],
    ['Pageviews',counts.pageview||0],
    ['Cliques CTA',counts.cta_click||0,''],
    ['Checkouts',counts.checkout_start||0,'hl'],
    ['PIX gerados',counts.pix_generated||0],
    ['Pedidos pagos',paid,'ok'],
    ['Receita paga',brl((orders||[]).filter(o=>PAID.includes(o.status)).reduce((s,o)=>s+o.total_cents,0)),'ok'],
  ];
  $('kpis').innerHTML=kpis.map(([l,v,c])=>`<div class="kpi ${c||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  /* produto */
  const {data:[prod]}=await sb.from('products').select('price_cents,compare_at_cents,stock').eq('id',PID);
  if(prod){$('p-price').value=(prod.price_cents/100).toFixed(2);$('p-compare').value=((prod.compare_at_cents||0)/100).toFixed(2);$('p-stock').value=prod.stock;}

  /* pedidos */
  const tb=$('orders').querySelector('tbody');
  tb.innerHTML=(orders||[]).map(o=>{
    const a=o.shipping_address||{};
    const st=PAID.includes(o.status)?'<span class="st paid">'+o.status+'</span>':o.status==='pending_payment'?'<span class="st pending">aguard. pix</span>':'<span class="st other">'+o.status+'</span>';
    return `<tr><td>#${o.number}<br><span class="addr">${hr(o.created_at)}</span></td>
      <td><b>${o.customer_name||'—'}</b><br><span class="addr">${o.email||''}<br>${o.phone||''}</span></td>
      <td class="addr">${a.line1||'—'}<br>${a.city||''} ${a.state||''} ${a.zip||''}</td>
      <td><span class="tag ${o.payment_method==='pix'?'pix':''}">${o.payment_method||'—'}</span></td>
      <td><b>${brl(o.total_cents)}</b></td><td>${st}</td></tr>`;
  }).join('')||'<tr><td colspan="6">Sem pedidos ainda.</td></tr>';

  /* eventos recentes */
  $('events').querySelector('tbody').innerHTML=(ev||[]).slice(0,50).map(e=>{
    const m=Object.entries(e.meta||{}).map(([k,v])=>`${k}: ${v}`).join(' · ');
    return `<tr><td class="addr">${hr(e.created_at)}</td><td><b>${e.event}</b></td><td class="addr">${m||'—'}</td></tr>`;
  }).join('')||'<tr><td colspan="3">Sem eventos.</td></tr>';
}

/* ---------- salvar preço ---------- */
$('p-save').onclick=async()=>{
  $('p-msg').textContent='';$('p-msg').className='msg';
  const price=Math.round(parseFloat($('p-price').value)*100);
  const cmp=Math.round(parseFloat($('p-compare').value)*100);
  const stock=parseInt($('p-stock').value)||0;
  if(!price){$('p-msg').textContent='Preço inválido.';$('p-msg').classList.add('e');return;}
  const {error}=await sb.from('products').update({price_cents:price,compare_at_cents:cmp||null,stock}).eq('id',PID);
  $('p-msg').textContent=error?'Erro: '+error.message:'Salvo — a página já mostra o novo preço.';
  $('p-msg').classList.add(error?'e':'o');
};
</script>
</body>
</html>
